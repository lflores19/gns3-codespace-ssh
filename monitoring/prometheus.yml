global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [ "/etc/prometheus/alerts/alerts.yml" ]

alerting:
  alertmanagers: [ { static_configs: [ { targets: [ "lab-alertmanager:9093" ] } ] } ]

scrape_configs:
  - job_name: prometheus
    static_configs: [ { targets: [ "127.0.0.1:9090" ] } ]
  - job_name: node
    static_configs: [ { targets: [ "lab-ovs-sw1:9100", "lab-fw1:9100" ] } ]
    # targets reales: se ajustan con las IPs/containers reales del plano
