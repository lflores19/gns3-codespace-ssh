# OpenVPN server — VPN01/VPN02 del prompt (interfaz tun0 + DMZ unicamente).
# PKI: generar con scripts/gen-pki.sh antes de levantar (nada de secretos en git).
port 1194
proto tcp
dev tun0
server 10.250.0.0 255.255.255.0
ca      /etc/openvpn/pki/ca.crt
cert    /etc/openvpn/pki/server.crt
key     /etc/openvpn/pki/server.key
dh      /etc/openvpn/pki/dh.pem
tls-auth /etc/openvpn/pki/ta.key 0
keepalive 10 120
persist-key
persist-tun
user nobody
group nobody
verb 3
# rusas solo a DMZ/servicios permitidos (FW06 la filtra ademas)
push "route 10.10.30.0 255.255.255.0"
status /var/log/openvpn-status.log
