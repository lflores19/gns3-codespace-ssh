options {
    directory "/var/bind";
    listen-on { 10.10.30.11; 127.0.0.1; };
    allow-query { 10.10.0.0/16; localhost; };
    recursion yes;
    dnssec-validation auto;
};

zone "empresa.test" {
    type primary;
    file "/var/bind/zones/db.empresa.test";
};

zone "10.10.10.in-addr.arpa" { type primary; file "/var/bind/zones/db.10.10.10"; };
zone "20.10.10.in-addr.arpa" { type primary; file "/var/bind/zones/db.10.10.20"; };
zone "30.10.10.in-addr.arpa" { type primary; file "/var/bind/zones/db.10.10.30"; };
