# DNS local del lab (sin forwarders externos en esta fase)
no-resolv
no-hosts
domain=lab.local
local=/lab.local/
address=/web1.lab.local/172.16.0.20
address=/fw1.lab.local/172.16.0.1
# DHCP por VLAN (rangos del diseno lab.yaml)
dhcp-range=set:v10,192.168.10.100,192.168.10.159,255.255.255.0,12h
dhcp-range=set:v20,192.168.20.100,192.168.20.159,255.255.255.0,12h
dhcp-range=set:v40,192.168.40.100,192.168.40.159,255.255.255.0,12h
dhcp-option=tag:v10,3,192.168.10.1
dhcp-option=tag:v10,6,192.168.10.1
dhcp-option=tag:v20,3,192.168.20.1
dhcp-option=tag:v20,6,192.168.20.1
dhcp-option=tag:v40,3,192.168.40.1
dhcp-option=tag:v40,6,192.168.40.1
interface=eth0.10
interface=eth0.20
interface=eth0.40
bind-interfaces
log-dhcp
log-queries
ptr-record=20.0.16.172.in-addr.arpa,web1.lab.local
