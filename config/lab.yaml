# Observed inventory and planning model for the GNS3 Codespace lab.
# This file is documentation, not a GNS3 API export or a single source of truth.
# Confirm live state through the API and evidence before operating on the project.
meta:
  project_name: utp-network-lab
  observed_project_id: e792c7b3-8a50-4d0b-a93a-ab64e7e6e344
  gns3_api: http://127.0.0.1:3080/v2
  platform: GNS3 2.2.55 in Codespaces
  inventory_evidence: evidence/utp-lab-ids.json
  status_sources:
    - docs/estado.md
    - docs/informe.md
  truth_boundary: "Observed sections summarize evidence; live GNS3 API state remains authoritative."
  versioned_snapshots:
    - config/firewall/fw.nft
    - config/dns/lab.conf
  snapshot_note: "Snapshots record observed guest configuration; they do not automatically rebuild or update guest qcow2 disks."

# Six-VLAN network mapping observed on fw1 router-on-a-stick.
vlans:
  - id: 10
    name: ventas
    subnet: 192.168.10.0/24
    gateway: 192.168.10.1
    observed_role: Sales access hosts
  - id: 20
    name: administracion
    subnet: 192.168.20.0/24
    gateway: 192.168.20.1
    observed_role: Administration; admin-vm receives DHCP here
  - id: 40
    name: invitados
    subnet: 192.168.40.0/24
    gateway: 192.168.40.1
    observed_role: Guest access host
  - id: 99
    name: gestion
    subnet: 192.168.99.0/24
    gateway: 192.168.99.1
    observed_role: Management access host
  - id: 200
    name: dmz
    subnet: 172.16.0.0/24
    gateway: 172.16.0.1
    observed_role: QEMU service segment
  - id: 300
    name: wan
    subnet: 10.20.30.0/24
    gateway: 10.20.30.1
    observed_role: WAN peer segment

observed_runtime:
  switching:
    - name: sw1
      kind: Dynamips EtherSwitch
      node_id: 7e0ac498-b987-4349-ad8a-8e2ace322a72
    - name: sw2
      kind: Dynamips EtherSwitch
      node_id: f22da109-b185-4339-8887-240649e4a462
  trunk:
    endpoints: [sw1, sw2]
    link_id: e3357617-4eaa-4b62-ab36-5244f2561962
    encapsulation: 802.1Q
  qemu_alpine:
    - name: fw1
      role: router-on-a-stick gateway and trunk endpoint
      node_id: 0549d1a7-bf1a-4b31-bf7b-3497cb234b2e
      adapters: 1
      services_observed: [nftables, dnsmasq, WireGuard, Suricata]
    - name: web1
      role: DMZ web and SMB service host
      ip: 172.16.0.20
      vlan: 200
      node_id: f930f3c4-ecdf-4c43-ab73-98fe3db88d1d
    - name: client1
      role: Inventory application host (Flask/Gunicorn)
      status: deployed; observed on TCP 5000
      ip: 172.16.0.21
      vlan: 200
      node_id: 0c9673b1-0c72-4c37-a53b-ec31cbfc54e9
      services_observed: [Flask, Gunicorn, inventory application]
    - name: admin-vm
      role: administration client
      vlan: 20
      addressing: DHCP observed
      node_id: 839ecc1e-8784-4b60-9a55-105e0fc8d7aa
    - name: wan-vpn
      role: WireGuard WAN peer
      ip: 10.20.30.60
      vlan: 300
      node_id: ec9c6bb7-51b4-40b6-9bf8-b02bc33ded2a
    - name: mon1
      role: Monitoring and PostgreSQL 16 host
      status: deployed; PostgreSQL observed on TCP 5432
      ip: 172.16.0.30
      vlan: 200
      node_id: 58c005e9-eb48-4e7b-89d0-c8c9626d5130 # Observed via GNS3 API 2026-09-26; not present in initial inventory evidence
      services_observed: [Prometheus, blackbox-exporter, node-exporter, Grafana, PostgreSQL 16]
  vpcs:
    - {name: pc-a10, vlan: 10}
    - {name: pc-d10, vlan: 10}
    - {name: pc-inv40, vlan: 40}
    - {name: pc-admin20, vlan: 20}
    - {name: pc-mgmt99, vlan: 99}
    - {name: pc-wan300, vlan: 300}
    - {name: pc-dmz, vlan: 200}

platform_limitations:
  docker_nodes: not functional in this Codespace runtime
  ovs_and_openflow: not feasible in this Codespace runtime
  qemu_acceleration: TCG only; no KVM
  performance: PERF01 skipped; no performance claim

# Planning only. These items are not a deployed declarative topology.
desired_future:
  reconciliation_required: true
  candidates:
    - Validate a live API inventory before changing the persisted project.
    - Keep Docker, OVS, and OpenFlow outside this Codespace deployment scope.
    - Evaluate Windows VPN interoperability separately from the observed QEMU peer.
