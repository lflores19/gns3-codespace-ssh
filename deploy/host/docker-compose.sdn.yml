name: utp-lab-sdn

networks:
  oob:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.250.0/24
          gateway: 172.29.250.1

services:
  controller:
    build: ../../controller
    container_name: lab-ctrl1
    networks:
      oob: { ipv4_address: 172.29.250.10 }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6653 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sw1:
    build: ../../docker/ovs
    container_name: lab-ovs-sw1
    privileged: true
    environment:
      OVS_BRIDGE: br0
      OVS_CTRL_IP: 172.29.250.10
      OVS_CTRL_PORT: 6653
    networks:
      oob: { ipv4_address: 172.29.250.11 }
    depends_on:
      controller: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "ovs-vsctl --timeout=3 show && ovs-vsctl list-br | grep -q br0"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  sw2:
    build: ../../docker/ovs
    container_name: lab-ovs-sw2
    privileged: true
    environment:
      OVS_BRIDGE: br0
      OVS_CTRL_IP: 172.29.250.10
      OVS_CTRL_PORT: 6653
    networks:
      oob: { ipv4_address: 172.29.250.12 }
    depends_on:
      controller: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "ovs-vsctl --timeout=3 show && ovs-vsctl list-br | grep -q br0"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped
