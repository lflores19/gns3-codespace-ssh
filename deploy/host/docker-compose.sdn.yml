name: utp-lab-sdn

# Etapa 4 (spec Comercial Andina): VLANs 10/20/30/40/50 etiquetadas en trunk SW1↔SW2;
# la gestión (VLAN99) es segmento independiente (sin trunk), según spec §5.1

networks:
  oob:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.99.0/24
          gateway: 10.10.99.1
  backbone:        # enlace entre switches — transporta tramas 802.1Q
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: lab-backbone
  vlan10_sw1: { driver: bridge, driver_opts: { com.docker.network.bridge.name: vlan10sw1 } }
  vlan40_sw1: { driver: bridge, driver_opts: { com.docker.network.bridge.name: vlan40sw1 } }
  vlan50_sw2: { driver: bridge, driver_opts: { com.docker.network.bridge.name: vlan50sw2 } }
  vlan20_sw1: { driver: bridge, driver_opts: { com.docker.network.bridge.name: vlan20sw1 } }
  vlan40_sw2: { driver: bridge, driver_opts: { com.docker.network.bridge.name: vlan40sw2 } }

services:
  controller:
    build: ../../controller
    container_name: lab-ctrl1
    networks:
      oob: { ipv4_address: 10.10.99.10 }
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6653 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  sw1:
    build: ../../docker/ovs
    container_name: lab-ovs-sw1
    privileged: true
    environment:
      OVS_BRIDGE: br0
      OVS_CTRL_IP: 10.10.99.10
      OVS_CTRL_PORT: 6653
      # eth0=oob  eth1=backbone(trunk)  eth2=acc VLAN10  eth3=acc VLAN20
      OVS_PORTS: "eth1=trunk:10,20,30,40,50 eth2=access:10 eth3=access:20"
    networks:
      oob: { ipv4_address: 10.10.99.21 }   # eth0
      backbone: {}                            # eth1
      vlan10_sw1: {}                          # eth2
      vlan20_sw1: {}                          # eth3
    depends_on:
      controller: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "ovs-vsctl --timeout=3 show && ovs-vsctl list-br | grep -q br0"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  sw2:
    build: ../../docker/ovs
    container_name: lab-ovs-sw2
    privileged: true
    environment:
      OVS_BRIDGE: br0
      OVS_CTRL_IP: 10.10.99.10
      OVS_CTRL_PORT: 6653
      OVS_PORTS: "eth1=trunk:10,20,30,40,50 eth2=access:40 eth3=access:50"
    networks:
      oob: { ipv4_address: 10.10.99.22 }   # eth0
      backbone: {}                            # eth1
      vlan40_sw2: {}                          # eth2
      vlan50_sw2: {}                          # eth3
    depends_on:
      controller: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "ovs-vsctl --timeout=3 show && ovs-vsctl list-br | grep -q br0"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # firewall router-on-a-stick, gateways 10.10.x.1 por subinterface
  fw:
    build: ../../docker/vpn
    container_name: lab-fw1
    cap_add: [ NET_ADMIN ]
    environment:
      FW_UPLINK: eth1
      FW_VLANS: "10:10.10.10.1/24 20:10.10.20.1/24 40:10.10.40.1/24 50:10.10.50.1/24"
    networks:
      oob: { ipv4_address: 10.10.99.1 }   # gestión
      backbone: {}                            # eth1: trunk hacia SW1
    restart: unless-stopped

  # clientes de prueba por VLAN — etapa de verificación
  pc10a:
    image: alpine:3.20
    container_name: lab-pc10a
    command: sh -c 'ip route replace default via 10.10.10.1; sleep 3600'
    networks:
      vlan10_sw1: { ipv4_address: 10.10.10.101 }
    cap_add: [ NET_ADMIN ]
    depends_on: [ fw ]

  pc20:
    image: alpine:3.20
    container_name: lab-pc20
    command: sh -c 'ip route replace default via 10.10.20.1; sleep 3600'
    networks:
      vlan20_sw1: { ipv4_address: 10.10.20.102 }
    cap_add: [ NET_ADMIN ]
    depends_on: [ fw ]

  pc40:
    image: alpine:3.20
    container_name: lab-pc40
    command: sh -c 'ip route replace default via 10.10.40.1; sleep 3600'
    networks:
      vlan40_sw2: { ipv4_address: 10.10.40.101 }
    cap_add: [ NET_ADMIN ]
    depends_on: [ fw ]

  pc50:
    image: alpine:3.20
    container_name: lab-pc50
    command: sh -c 'ip route replace default via 10.10.50.1; sleep 3600'
    networks:
      vlan50_sw2: { ipv4_address: 10.10.50.101 }
    cap_add: [ NET_ADMIN ]
    depends_on: [ fw ]
