name: utp-lab-srv

# Etapa 7: servicios en VLAN30 (red plana del plano Docker local).
# Limitación medida: DHCP broadcast no cruza entre bridges Docker; el relay
# (giaddr) se implementa en fw1, ver docs/informe-host.md cuando se mida.

networks:
  servers:
    driver: bridge
    driver_opts: { com.docker.network.bridge.name: lab-srv }
    ipam: { config: [ { subnet: 10.10.30.0/24, gateway: 10.10.30.1 } ] }

services:
  dns:
    build: ../../docker/dns
    container_name: lab-dns
    networks: { servers: { ipv4_address: 10.10.30.11 } }
    cap_add: [ NET_BIND_SERVICE ]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: lab-db
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida via entorno}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: { servers: { ipv4_address: 10.10.30.30 } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventario"]
      interval: 10s
      timeout: 3s
      retries: 6

  app:
    build: ../../docker/app
    container_name: lab-app
    environment:
      DB_HOST: 10.10.30.30
      DB_NAME: inventario
      DB_USER: inventory_app
      DB_PASS: ${DB_PASS:?}
    networks: { servers: { ipv4_address: 10.10.30.21 } }
    depends_on: { db: { condition: service_healthy } }

  web:
    build: ../../docker/web
    container_name: lab-web
    networks: { servers: { ipv4_address: 10.10.30.20 } }
    depends_on: [ app ]

  samba:
    build: ../../docker/samba
    container_name: lab-samba
    networks: { servers: { ipv4_address: 10.10.30.40 } }
    cap_add: [ NET_ADMIN ]

  dhcp:
    build: ../../docker/dhcp
    container_name: lab-dhcp
    networks: { servers: { ipv4_address: 10.10.30.10 } }
    cap_add: [ NET_RAW, NET_ADMIN ]

volumes:
  db-data:
