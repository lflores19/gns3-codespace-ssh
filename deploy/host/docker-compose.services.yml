name: utp-lab-srv

# Etapa 7 (spec Andina §6): VLAN30 servidores, IP fijas del spec:
#   INFRA01 10.10.30.10 (Kea+BIND9 en un solo container — spec pide misma IP)
#   WEB01 10.10.30.20, DB01 10.10.30.30, FILE01 10.10.30.40
# Limitación de relays medida: DHCP broadcast no cruza bridges Docker;
# el relay (giaddr) se correra en el fw en etapa de integracion.

networks:
  servers:
    driver: bridge
    driver_opts: { com.docker.network.bridge.name: lab-srv }
    ipam: { config: [ { subnet: 10.10.30.0/24, gateway: 10.10.30.1 } ] }

services:
  infra:
    build: ../../docker/infra
    container_name: lab-infra01
    networks: { servers: { ipv4_address: 10.10.30.10 } }
    cap_add: [ NET_BIND_SERVICE, NET_RAW, NET_ADMIN ]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: lab-db01
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS requerida via entorno}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ../../docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: { servers: { ipv4_address: 10.10.30.30 } }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventario"]
      interval: 10s
      timeout: 3s
      retries: 6

  app:
    build: ../../docker/app
    container_name: lab-web01-app
    environment:
      DB_HOST: 10.10.30.30
      DB_NAME: inventario
      DB_USER: inventory_app
      DB_PASS: ${DB_PASS:?}
    networks: { servers: { ipv4_address: 10.10.30.21 } }
    depends_on: { db: { condition: service_healthy } }

  web:
    build: ../../docker/web
    container_name: lab-web01
    networks: { servers: { ipv4_address: 10.10.30.20 } }
    depends_on: [ app ]

  samba:
    build: ../../docker/samba
    container_name: lab-file01
    networks: { servers: { ipv4_address: 10.10.30.40 } }
    cap_add: [ NET_ADMIN ]

volumes:
  db-data:
